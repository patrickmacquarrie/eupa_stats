name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Job names are the required status checks on main; renaming one means updating the ruleset.
  # Typecheck: typecheck, unit tests, validation baseline, both builds.
  checks:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Fails when any engine result differs from scripts/validate-baseline.json.
      - run: npm run validate
      - run: npm run build
      - run: npm run build:share

  # Browser: create, record, refresh recovery, finish, dispute, export/import, offline.
  browser:
    name: Browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
