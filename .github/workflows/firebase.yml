name: Deploy to Firebase

# Publishes the production build to Firebase Hosting (https://eupa-stats.web.app) and the
# Firestore security rules, whenever main changes. main only accepts changes that passed CI.
# Needs the FIREBASE_SERVICE_ACCOUNT secret (see README); until it's set this does nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Check for the deploy key
        id: key
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::notice::FIREBASE_SERVICE_ACCOUNT isn't set, so nothing was deployed. See the README's Hosting section."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.key.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.key.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: steps.key.outputs.ready == 'true'
        run: npm ci
      - if: steps.key.outputs.ready == 'true'
        run: npm run build
      - if: steps.key.outputs.ready == 'true'
        name: Deploy hosting and security rules
        run: |
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-key.json"
          npx firebase deploy --only hosting,firestore:rules --project eupa-stats --non-interactive
